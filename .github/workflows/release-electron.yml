# Builds and publishes the Electron release when a version tag is pushed.
#
# **Replaces release.yml**, which built the Tauri app and is kept on manual
# dispatch only while Phase 29 settles. The old one had to compile Rust per
# platform, sign every bundle with minisign, assemble latest.json across four
# jobs, and then unpack and repack the AppImage to take the host's graphics
# libraries back out. None of that applies here: electron-builder produces the
# installers and the update feed together, and there is no Rust to compile.
#
# Nothing here touches the user or her worlds — it builds public source on
# GitHub's runners.
name: Release (Electron)

on:
  push:
    tags:
      - "v*"
  # A dry run against any commit: builds all three platforms and uploads the
  # installers as workflow artifacts without creating or touching a release.
  # This is how the pipeline gets tested without spending a version number.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fails in seconds if the tag and the version files disagree, before anything
  # spends minutes building. A mismatch here is the failure that used to ship:
  # the installer says one version, the updater compares another, and the
  # update button goes quiet for everyone.
  check-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Version files must match the tag
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"
      # Fails here, in seconds, if this version has no section written for it.
      # These notes are not only what the releases page shows — they are copied
      # into the update feed, which is what Settings → Updates puts in front of
      # someone deciding whether to install.
      #
      # They are not carried out of this job. Each build job reads them out of
      # RELEASES.md itself, straight into a file — see the packaging step.
      - name: Release notes must exist for this version
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      # **The draft is opened here, once, rather than by whichever build job
      # reaches the publish step first.** Each of the three looks for a release
      # for this tag and creates one when it finds none, and on the first
      # v0.6.0 rebuild two of them created one in the same second: the
      # installers came out split across two drafts, one holding Windows and
      # half of macOS, the other Linux and the other half. Every job reported
      # success. Opening it up front leaves them nothing to race over — they
      # find it and upload into it.
      #
      # The title is set here too, which is why earlier releases read
      # "Anamnesis v0.5.0" and the racing drafts only read "0.6.0".
      - name: Open the draft the builds upload into
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists — leaving it alone."
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "Anamnesis $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

  build:
    # `always()` so a manual dry run, which skips the version check entirely,
    # still builds. On a tag the check must have passed — and, since it is also
    # what opens the draft, must have finished before anything tries to upload.
    needs: check-version
    if: always() && needs.check-version.result != 'failure'
    strategy:
      # One platform failing shouldn't bin the others — a release with two of
      # three installers is worth having, and the missing one can be re-run.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-latest
            name: macos
          - platform: ubuntu-22.04
            name: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Once, on the cheapest runner, rather than three times. The old workflow
      # ran these per platform, which is three identical answers to the same
      # question — nothing in lint or the test suite is platform-dependent.
      - name: Lint and test
        if: matrix.name == 'linux'
        run: |
          pnpm lint
          pnpm test

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # **Stops macOS looking for a signing identity it will not find.**
          # This app is deliberately unsigned (2026-08-25) — a Windows
          # certificate is a few hundred a year to remove a first-run warning
          # and an Apple one is another hundred on top. Without this, the mac
          # build searches the keychain and fails the job rather than producing
          # an unsigned dmg. See docs/releasing.md.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # **The notes go in a file and never on the command line.** Windows
            # caps a command line at 8,191 characters; v0.6.0's notes were 9,914
            # and the Windows job died with "The command line is too long" after
            # macOS and Linux had already published, leaving a draft with two
            # thirds of a release in it. A file has no such ceiling, and it also
            # means a quote or a backtick in the notes has nothing to escape
            # out of.
            node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
            # Published as a draft, so the release can be read before anyone's
            # update button finds it.
            pnpm electron:package --publish always \
              -c.releaseInfo.releaseNotesFile=release-notes.md
          else
            pnpm electron:package --publish never
          fi

      - name: Keep the installers from a dry run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anamnesis-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: error
          retention-days: 7
