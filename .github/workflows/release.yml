# Builds and publishes a release when a version tag is pushed.
#
# The whole thing exists because cutting a release by hand meant bumping the
# version in three files, remembering to set TAURI_SIGNING_PRIVATE_KEY (without
# which every client rejects the update as unsigned), hand-writing latest.json
# with the .sig contents pasted in, and doing all of it again per platform.
# Now: `node scripts/set-version.mjs 0.3.0`, commit, tag, push.
#
# Nothing here touches the user or her worlds — it builds public source on
# GitHub's runners. See CLAUDE.md's Policy Boundary; that line is about what the
# *app* sends, and the app still sends nothing.
name: Release

on:
  push:
    tags:
      - "v*"

# The release job creates a GitHub release and uploads to it.
permissions:
  contents: write

jobs:
  # Fails in seconds if the tag and the three version files disagree, before
  # anything spends twenty minutes compiling. A mismatch here is the failure
  # that used to ship: the installer says one version, the updater compares
  # another, and the update button goes quiet for everyone.
  check-version:
    runs-on: ubuntu-22.04
    # Read once here rather than per platform: four jobs each parsing the same
    # file could disagree, and the body has to be identical in all four because
    # whichever finishes last is the one that sticks.
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
      - name: Version files must match the tag
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"
      # Fails here, in seconds, if this version has no section written for it.
      # A release with no notes is worth stopping for: the body it would carry
      # is baked into latest.json at build time and can't be corrected on the
      # web page afterwards — see scripts/release-notes.mjs.
      - name: Release notes must exist for this version
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}"
            echo
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: check-version
    strategy:
      # One platform failing shouldn't bin the others — a release with three of
      # four bundles is worth having, and the missing one can be re-run.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 on Linux needs webkit2gtk 4.1 specifically — 4.0 is what
      # Tauri v1 used and it will not build against it.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Guards the release build with the same checks a change is held to.
      # A tag is the worst possible moment to find out the types don't compile.
      - run: pnpm lint
      - run: pnpm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this the bundle ships with no .sig files and every existing
          # install rejects the update. See docs/handoff.md §Updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Anamnesis ${{ github.ref_name }}
          # This version's section of RELEASES.md, read by the job above. It is
          # not only what the releases page shows: tauri-action copies it into
          # latest.json's `notes`, and that is what Settings → Updates puts in
          # front of someone deciding whether to install. It used to be a
          # placeholder pointing at CHANGELOG.md, on the assumption the real
          # notes could be pasted in afterwards — they can't, because the copy
          # in latest.json is written now and editing the release later doesn't
          # touch it.
          releaseBody: ${{ needs.check-version.outputs.notes }}
          # Published as a draft so the release can be read before anyone's
          # update button finds it — and because latest.json is assembled
          # across four separate jobs, so an early-published release would be
          # offering platforms that hadn't finished building.
          releaseDraft: true
          prerelease: false
          # Writes latest.json, merging this platform's entry into whatever the
          # other matrix jobs have already uploaded. Hand-writing that file with
          # the .sig contents inlined was the fiddliest part of the old process.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Takes the host's graphics libraries back out of the AppImage the matrix
  # job just built, re-signs it, and corrects latest.json.
  #
  # **Why this is a separate job after the fact rather than part of the build.**
  # Tauri's bundler seals the AppImage itself and offers no hook between
  # assembling the AppDir and packaging it, so the only place to remove
  # anything is afterwards — and the update signature is generated over the
  # packaged file, so a repack invalidates it. That means re-signing, and
  # re-signing means correcting the copy of the signature inside latest.json.
  # Doing that here, once every matrix leg has finished, is what keeps it from
  # racing: each leg merges its own entry into latest.json, so patching from
  # inside one of them would be overwritten by whichever finished later.
  #
  # It works on the built artifact rather than rebuilding, so this costs a
  # download and a repack rather than another five-minute compile.
  #
  # See docs/plan.md → Known Bugs for the failure this fixes: the bundled
  # libwayland-client cannot talk to an older host's EGL, and the app dies with
  # EGL_BAD_PARAMETER before a window appears. Confirmed fixed on Fedora and
  # CachyOS, 2026-08-21, by the person whose machine it failed on.
  fix-linux-appimage:
    needs: [check-version, release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Node dependencies only — this job never compiles Rust. It needs the
      # Tauri CLI for `signer sign` and nothing else.
      - run: pnpm install --frozen-lockfile

      - name: Take the release's AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern '*.AppImage' --dir . --clobber
          APPIMAGE="$(ls *.AppImage)"
          echo "APPIMAGE=$APPIMAGE" >> "$GITHUB_ENV"
          echo "took $APPIMAGE"

      - name: Strip the host's libraries out of it
        run: |
          set -euo pipefail
          curl -fsSL -o excludelist \
            https://raw.githubusercontent.com/AppImage/pkg2appimage/master/excludelist
          chmod +x "$APPIMAGE"
          # Extracting gives back the AppDir the bundler sealed. It always
          # lands in ./squashfs-root, which is also where appimagetool
          # unpacks itself later — so this one is renamed out of the way now.
          ./"$APPIMAGE" --appimage-extract > /dev/null
          rm -rf appdir && mv squashfs-root appdir
          grep -v '^\s*#' excludelist | grep -v '^\s*$' | sort -u > names.txt

          removed=0
          while read -r name; do
            [ -z "$name" ] && continue
            while IFS= read -r path; do
              echo "removing $(basename "$path")"
              rm -f "$path"
              removed=$((removed + 1))
            done < <(find appdir -type f -name "${name}*" 2>/dev/null || true)
          done < names.txt
          echo "removed $removed bundled libraries"

          # Both checks exist so a silent no-op can never be published. The
          # second names the library his LD_PRELOAD finding pinned it to.
          test "$removed" -gt 0 || { echo "nothing matched the excludelist"; exit 1; }
          if find appdir -name 'libwayland-client*' | grep -q .; then
            echo "libwayland-client is still bundled"; exit 1
          fi

      - name: Repack under the same name
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # No FUSE on the runner, so run the tool out of its own contents.
          ./appimagetool --appimage-extract > /dev/null
          # Same name as the file the release already has, so the upload below
          # replaces it rather than adding a second one beside it.
          rm -f "$APPIMAGE"
          ARCH=x86_64 ./squashfs-root/AppRun appdir "$APPIMAGE"
          ls -la "$APPIMAGE"

      # The .sig the matrix job uploaded describes the file that existed
      # before the repack. Every installed copy checks the signature before
      # applying an update, so shipping the old one means nobody can update.
      - name: Sign it again
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Key and password come from the environment, which the CLI reads
          # itself — passing them as arguments would put the private key in
          # the runner's process list.
          pnpm tauri signer sign "$APPIMAGE"
          test -f "$APPIMAGE.sig" || { echo "no signature was written"; exit 1; }

      - name: Put both back on the release, and correct latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "$APPIMAGE" "$APPIMAGE.sig" --clobber

          gh release download "$GITHUB_REF_NAME" --pattern 'latest.json' --dir . --clobber
          SIGNATURE="$(cat "$APPIMAGE.sig")"
          # Only the AppImage entries move. The deb and rpm carry their own
          # signatures over their own files and were never touched.
          SIGNATURE="$SIGNATURE" node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            const signature = process.env.SIGNATURE.trim();
            let patched = 0;
            for (const [platform, entry] of Object.entries(manifest.platforms ?? {})) {
              if (!platform.startsWith("linux")) continue;
              if (!/\.AppImage($|\?)/.test(entry.url ?? "")) continue;
              entry.signature = signature;
              patched++;
            }
            if (patched === 0) throw new Error("latest.json names no AppImage to correct");
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            console.log("corrected " + patched + " entries");
          '
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
