# Lint, tests and the frontend build, on every push and pull request.
#
# Exists mostly to keep the release workflow honest. That one only runs when a
# tag is pushed, which is the single worst moment to discover that a clean
# checkout doesn't install or the types don't compile — this runs the same
# first half on every change, so by the time there's a tag the only untested
# part left is the Rust bundle.
#
# Deliberately does not build the desktop app: that's a fifteen-minute Rust
# compile per platform, and it earns its keep at release time rather than on
# every push.
name: CI

# **A change that only touches prose runs nothing.** A planning note or a
# changelog edit cannot break lint, the types, the build or the app, and the
# app job is twenty runner-minutes — spending them to confirm that `plan.md` is
# still valid Markdown is the clearest waste in here. Anything that also
# touches code fails these filters and runs the lot, which is the behaviour to
# want: `paths-ignore` skips only when *every* changed file matches.
#
# Note what is deliberately not ignored: `.github/**`. A change to this file has
# to run this file.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # **11 rather than 10, because `pnpm-workspace.yaml` is written in 11's
      # syntax.** `allowBuilds` — the list saying which packages may run an
      # install step — is a pnpm 11 field, and pnpm 10 does not fail on it, it
      # ignores it. So every entry in that file has been silently doing nothing
      # here since it was added: Electron never got installed, and the two
      # deliberate decisions beside it never applied either.
      #
      # The other three workflows still pin 10 and have the same problem. Left
      # alone in this change on purpose — a release workflow that has never been
      # run is not something to alter blind alongside a test fix.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test
      # `pnpm build` is `tsc && vite build` — the typecheck and the exact
      # command tauri.conf.json's beforeBuildCommand runs at release time.
      - run: pnpm build

      # Cheap, and it catches the mistake that quietly breaks the update button:
      # a version bumped in some of the four files but not all of them.
      - run: node scripts/check-version.mjs

  # The scenarios in `e2e/` — the real app, started, driven and read from.
  #
  # **A separate job from `check` rather than another step in it**, for the same
  # reason the two suites have separate configs: this one downloads Electron,
  # builds the page and opens a window, and `check` is the fast answer that
  # should not wait on any of that. Separate also means a failure here is
  # legible at a glance as "the app misbehaved" rather than "something in CI
  # went wrong".
  #
  # Still not the desktop *build* — that is a release-time job. This runs the
  # built page inside the Electron that `pnpm install` already fetched.
  #
  # **Split across eight runners, because this job was the entire wait.**
  # Measured 2026-09-06: `check` finished in 66 seconds and this took 19m42s,
  # so a pull request took twenty minutes to answer and every one of them was
  # this. The suite is four times slower here than on a desktop — each scenario
  # file starts, drives and closes a real Electron window, and a runner is a
  # slow machine with a virtual screen.
  #
  # **Sharding is safe here specifically because every file launches its own
  # app.** There is no shared world, no shared window and no ordering between
  # files — `vitest --shard` splits by file, so a shard is just a smaller run of
  # the same independent things. Anything that ever introduces state shared
  # *between* scenario files breaks this, and would break running one file on
  # its own too, which is the more obvious symptom.
  #
  # Eight rather than four because the repository is public, so runner minutes
  # are free and the only real limit is how many jobs run at once. Each shard
  # builds the page itself; that is twenty seconds against the two and a half
  # minutes of tests it then runs, and sharing one build through an artifact
  # would cost more in upload and download than it saved.
  app:
    strategy:
      # Every shard reports. Cancelling the others on the first failure would
      # turn "three scenarios broke" into "one scenario broke", and hide the
      # other two until the fix for the first was pushed.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # **A runner has no screen, and Electron will not open a window without
      # one.** `xvfb-run` supplies a virtual display: the app genuinely starts
      # and genuinely draws, into a framebuffer nobody is looking at. This is
      # the whole reason these tests cannot simply live in `pnpm test`.
      - run: xvfb-run --auto-servernum pnpm test:app --shard=${{ matrix.shard }}/8
