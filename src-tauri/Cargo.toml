[package]
name = "anamnesis"
version = "0.2.0"
description = "A local-first worldbuilding wiki"
authors = ["Shiro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anamnesis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
# Update check. The updater carries its own signature verification (minisign,
# key generated locally) and its own network path — it does not widen the
# narrow `http:` scope granted to LK's image CDN.
tauri-plugin-updater = "2"
# Only for relaunching after an update installs.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

